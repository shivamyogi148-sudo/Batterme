  const NotificationSettingsScreen({super.key});

  @override
  State<NotificationSettingsScreen> createState() =>
      _NotificationSettingsScreenState();
}

class _NotificationSettingsScreenState
    extends State<NotificationSettingsScreen> {
  @override
  Widget build(BuildContext context) => Scaffold(
        appBar: AppBar(
          title: const Text('Reminder Settings'),
        ),
        body: ListView(
          padding: const EdgeInsets.all(18),
          children: [
            const Mascot(
              message:
                  'Pick a gentle time that works for you. You can change it anytime. 🔔',
            ),
            const SizedBox(height: 12),
            Card(
              child: SwitchListTile(
                value: NotificationPlan.enabled,
                onChanged: (v) => setState(
                  () => NotificationPlan.enabled = v,
                ),
                title: const Text(
                    'Daily challenge reminder'),
                subtitle: Text(
                  NotificationPlan.enabled
                      ? 'Scheduled for ${NotificationPlan.reminderTime}'
                      : 'Reminders are paused',
                ),
              ),
            ),
            Card(
              child: ListTile(
                leading: const Icon(Icons.schedule),
                title: const Text('Reminder time'),
                subtitle:
                    Text(NotificationPlan.reminderTime),
                onTap: () => _pickTime(),
              ),
            ),
            const Card(
              child: ListTile(
                leading: Icon(
                    Icons.notifications_active_outlined),
                title: Text('Permission'),
                subtitle: Text(
                  'The production build will request OS notification permission before scheduling.',
                ),
              ),
            ),
          ],
        ),
      );

  Future<void> _pickTime() async {
    final parts =
        NotificationPlan.reminderTime.split(':');

    final initial = TimeOfDay(
      hour: int.parse(parts[0]),
      minute: int.parse(parts[1]),
    );

    final t = await showTimePicker(
      context: context,
      initialTime: initial,
    );

    if (t != null) {
      setState(() {
        NotificationPlan.reminderTime =
            '${t.hour.toString().padLeft(2, '0')}:${t.minute.toString().padLeft(2, '0')}';
      });
    }
  }
}

