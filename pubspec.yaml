class TriggerLog extends StatefulWidget {
  const TriggerLog({super.key});

  @override
  State<TriggerLog> createState() => _TriggerLogState();
}

class _TriggerLogState extends State<TriggerLog> {
  final selected = <String>{};
  int strength = 5;
  String? replacement;

  @override
  Widget build(BuildContext context) => Scaffold(
        appBar: AppBar(
          title: const Text('Trigger & Urge Log'),
        ),
        body: ListView(
          padding: const EdgeInsets.all(18),
          children: [
            const Mascot(
              message:
                  'Understanding the pattern is progress. 🧠',
            ),
            const SizedBox(height: 12),
            Text(
              'What triggered the urge?',
              style: Theme.of(context)
                  .textTheme
                  .titleLarge
                  ?.copyWith(fontWeight: FontWeight.w800),
            ),
            ...AppContent.triggers.map(
              (t) => CheckboxListTile(
                value: selected.contains(t),
                title: Text(t),
                onChanged: (v) => setState(
                  () => v == true
                      ? selected.add(t)
                      : selected.remove(t),
                ),
              ),
            ),
            const SizedBox(height: 8),
            Text('Urge strength: $strength / 10'),
            Slider(
              value: strength.toDouble(),
              min: 1,
              max: 10,
              divisions: 9,
              onChanged: (v) =>
                  setState(() => strength = v.round()),
            ),
            const SizedBox(height: 8),
            Text(
              'What did you choose instead?',
              style: Theme.of(context)
                  .textTheme
                  .titleMedium
                  ?.copyWith(fontWeight: FontWeight.w700),
            ),
            DropdownButtonFormField<String>(
              value: replacement,
              items: AppContent.replacements
                  .map(
                    (x) => DropdownMenuItem(
                      value: x,
                      child: Text(x),
                    ),
                  )
                  .toList(),
              onChanged: (v) =>
                  setState(() => replacement = v),
              decoration: const InputDecoration(
                border: OutlineInputBorder(),
                hintText: 'Select a healthier action',
              ),
            ),
            const SizedBox(height: 14),
            FilledButton(
              onPressed: selected.isEmpty
                  ? null
                  : () {
                      ChallengeState.triggersLogged++;
                      Navigator.pop(context);
                    },
              child: const Text('Save log'),
            ),
          ],
        ),
      );
}

