class PhotoPlaceholder extends StatefulWidget {
  const PhotoPlaceholder({super.key});

  @override
  State<PhotoPlaceholder> createState() =>
      _PhotoPlaceholderState();
}

class _PhotoPlaceholderState
    extends State<PhotoPlaceholder> {
  XFile? photo;

  Future<void> pick() async {
    final p = await ImagePicker().pickImage(
      source: ImageSource.gallery,
      imageQuality: 90,
    );

    if (p != null) {
      setState(() => photo = p);
    }
  }

  @override
  Widget build(BuildContext context) => Scaffold(
        appBar: AppBar(
          title: const Text('Your Better Self'),
        ),
        body: ListView(
          padding: const EdgeInsets.all(20),
          children: [
            GestureDetector(
              onTap: pick,
              child: Container(
                height: 280,
                decoration: BoxDecoration(
                  borderRadius:
                      BorderRadius.circular(26),
                  color: Theme.of(context)
                      .colorScheme
                      .surfaceContainerHighest,
                ),
                clipBehavior: Clip.antiAlias,
                child: photo == null
                    ? const Center(
                        child: Text(
                          'Tap to choose your photo',
                        ),
                      )
                    : Image.file(
                        File(photo!.path),
                        fit: BoxFit.cover,
                      ),
              ),
            ),
            const SizedBox(height: 14),
            const Mascot(
              message:
                  'In the production version, your consented photo will be transformed into your cute Better Self cartoon. ✨',
            ),
            const SizedBox(height: 12),
            Card(
              child: SwitchListTile(
                value:
                    ConsentManager.aiPhotoConsent,
                onChanged: (v) => setState(
                  () => ConsentManager.setAi(v),
                ),
                title: const Text(
                  'I consent to AI photo processing',
                ),
                subtitle: const Text(
                  'Required before the photo can be sent to the AI service.',
                ),
              ),
            ),
            const SizedBox(height: 12),
            FilledButton.icon(
              onPressed: (photo == null ||
                      !ConsentManager.aiPhotoConsent)
                  ? null
                  : () async {
                      await AiPhotoService
                          .createBetterSelf(
                        imagePath: photo!.path,
                      );

                      if (context.mounted) {
                        ScaffoldMessenger.of(context)
                            .showSnackBar(
                          const SnackBar(
                            content: Text(
                              'AI generation contract is ready for secure backend integration.',
                            ),
                          ),
                        );
                      }
                    },
              icon: const Icon(Icons.auto_awesome),
              label: const Text('Create Better Self'),
            ),
          ],
        ),
      );      onTap:(){onTheme(ThemeMode.light);Navigator.pop(context);}),
    ListTile(
      leading:const Icon(Icons.dark_mode),
      title:const Text('Dark'),
      onTap:(){onTheme(ThemeMode.dark);Navigator.pop(context);}),
    const SizedBox(height:8),
  ]));
}
