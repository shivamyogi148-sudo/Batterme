    return Scaffold(
      appBar: AppBar(
        title: const Text('21-Day Challenge'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(18),
        children: [
          CuteMascot(size: 110),
          const SizedBox(height: 10),
          Text(
            'Day $day of 21',
            style: Theme.of(context)
                .textTheme
                .headlineSmall
                ?.copyWith(fontWeight: FontWeight.w900),
          ),
          const SizedBox(height: 8),
          LinearProgressIndicator(
            value: ChallengeState.completedDays / 21,
            minHeight: 10,
          ),
          const SizedBox(height: 18),
          Card(
            child: ListTile(
              leading: const Icon(Icons.loop),
              title: const Text('Old habit'),
              subtitle: Text(widget.oldHabit),
            ),
          ),
          Card(
            child: ListTile(
              leading: const Icon(Icons.favorite_outline),
              title: const Text('Replacement'),
              subtitle: Text(widget.replacement),
            ),
          ),
          const SizedBox(height: 10),
          Card(
            child: Padding(
              padding: const EdgeInsets.all(18),
              child: Text(
                AppContent.dailyTasks[
                    day - 1 < AppContent.dailyTasks.length
                        ? day - 1
                        : AppContent.dailyTasks.length - 1],
              ),
            ),
          ),
          const SizedBox(height: 12),
          FilledButton.icon(
            onPressed: doneToday
                ? null
                : () {
                    setState(() {
                      ChallengeState.completeDay(day);
                    });
                  },
            icon: Icon(
              doneToday
