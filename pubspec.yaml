            ),
          ),
          const SizedBox(height: 10),
          OutlinedButton.icon(
            onPressed: () => Navigator.push(
              context,
              MaterialPageRoute(
                builder: (_) => const TriggerTracker(),
              ),
            ),
            icon: const Icon(Icons.psychology_outlined),
            label: const Text('Track my triggers'),
          ),
        ],
      ),
    );
  }
